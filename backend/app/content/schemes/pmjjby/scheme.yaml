id: pmjjby
name:
  en: Life insurance through his bank account (PMJJBY)
  ta: வங்கிக் கணக்கு வழி ஆயுள் காப்பீடு (PMJJBY)
aliases:
- ஆயுள் காப்பீடு
- PMJJBY
- jeevan jyoti
- bank life insurance
conditions:
- id: husband_died
  text:
    en: Your husband has passed away
    ta: உங்கள் கணவர் காலமானார்
  kind: checkable
  any_of:
  - - fact: widowed
      op: eq
      value: 'yes'
      unknown_values: []
  source: pmjjby
- id: enrolled
  text:
    en: A yearly life insurance deduction (₹436; ₹330 in earlier years) was taken from his account
    ta: அவர் கணக்கிலிருந்து ஆண்டு ஆயுள் காப்பீட்டுத் தொகை (₹436; ₹330 முந்தைய ஆண்டுகளில்) பிடிக்கப்பட்டது
  kind: checkable
  any_of:
  - - fact: insurance_deduction
      op: in
      value:
      - life
      - both
      unknown_values:
      - none
  source: pmjjby
- id: husband_age_min
  text:
    en: He was 18 or older when he died
    ta: இறக்கும்போது அவர் வயது 18 அல்லது அதற்கு மேல்
  kind: checkable
  any_of:
  - - fact: husband_age_at_death
      op: min
      value: 18
  source: pmjjby
- id: husband_age_max
  text:
    en: He was 55 or younger when he died
    ta: இறக்கும்போது அவர் வயது 55 அல்லது அதற்குக் குறைவு
  kind: checkable
  any_of:
  - - fact: husband_age_at_death
      op: max
      value: 55
  source: pmjjby
checks:
- id: cover_active
  text:
    en: The bank or insurer must confirm that the cover was active when he died.
    ta: அவர் இறந்தபோது காப்பீடு நடப்பில் இருந்ததை வங்கி அல்லது காப்பீட்டு நிறுவனம் உறுதிப்படுத்த வேண்டும்.
  source: null
- id: deadline
  text:
    en: We could not confirm the claim deadline. Ask the bank now.
    ta: கோரிக்கைக் கால வரம்பை உறுதிப்படுத்த முடியவில்லை. வங்கியில் உடனே கேளுங்கள்.
  source: null
- id: nominee
  text:
    en: Ask the bank who the nominee is.
    ta: நியமனதாரர் யார் என்று வங்கியில் கேளுங்கள்.
  source: null
- id: waiting_period
  text:
    en: Ask whether a waiting period applies after joining.
    ta: சேர்ந்த பிறகு காத்திருப்புக் காலம் பொருந்துமா என்று கேளுங்கள்.
  source: null
- id: ask_bank_enrolment
  text:
    en: If you did not see a deduction, still ask the bank. Older amounts were different.
    ta: பிடித்தம் தெரியாவிட்டாலும் வங்கியில் கேளுங்கள். பழைய தொகைகள் வேறுபட்டவை.
  source: null
conflicts: []
amounts:
- text:
    en: ₹2,00,000 life cover
    ta: ஆயுள் காப்பீடு ₹2,00,000
  source: pmjjby
  when: []
documents:
  confirmed: false
  note:
    en: Not confirmed. Ask the office.
    ta: உறுதிப்படுத்தப்படவில்லை. அலுவலகத்தில் கேளுங்கள்.
  items: []
apply:
  text:
    en: Not confirmed. Ask the office.
    ta: உறுதிப்படுத்தப்படவில்லை. அலுவலகத்தில் கேளுங்கள்.
