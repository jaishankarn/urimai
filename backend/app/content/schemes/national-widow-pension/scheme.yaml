id: national-widow-pension
name:
  en: Indira Gandhi National Widow Pension
  ta: இந்திரா காந்தி தேசிய விதவை ஓய்வூதியம்
aliases:
- தேசிய விதவை ஓய்வூதியம்
- IGNWPS
- national widow pension
- desiya vithavai pension
conditions:
- id: lives_in_tn
  text:
    en: You live in Tamil Nadu
    ta: நீங்கள் தமிழ்நாட்டில் வசிக்கிறீர்கள்
  kind: checkable
  any_of:
  - - fact: lives_in_tn
      op: eq
      value: 'yes'
  source: charter
- id: widowed
  text:
    en: You are a widow
    ta: நீங்கள் கணவரை இழந்தவர்
  kind: checkable
  any_of:
  - - fact: widowed
      op: eq
      value: 'yes'
  source: charter
- id: age
  text:
    en: You are 40 or older
    ta: உங்கள் வயது 40 அல்லது அதற்கு மேல்
  kind: checkable
  any_of:
  - - fact: age
      op: min
      value: 40
  source: charter
- id: bpl
  text:
    en: Your household is below the poverty line
    ta: உங்கள் குடும்பம் வறுமைக் கோட்டிற்குக் கீழ் உள்ளது
  kind: checkable
  any_of:
  - - fact: bpl_card
      op: eq
      value: 'yes'
  source: charter
checks:
- id: destitute
  text:
    en: Officials still need to confirm that you count as destitute. We found no official definition.
    ta: நீங்கள் ஆதரவற்றவர் என்பதை அதிகாரிகள் உறுதிப்படுத்த வேண்டும். இதற்கான அதிகாரப்பூர்வ வரையறை எங்களுக்குக் கிடைக்கவில்லை.
  source: charter
- id: bpl_listing
  text:
    en: The office must confirm your below-poverty-line listing.
    ta: வறுமைக் கோட்டிற்குக் கீழ் உள்ள பட்டியலில் இருப்பதை அலுவலகம் உறுதிப்படுத்த வேண்டும்.
  source: null
- id: age_80
  text:
    en: If you are 80 or older, ask how the pension is paid. The central share is different.
    ta: 80 வயதுக்கு மேல் இருந்தால் ஓய்வூதியம் எப்படி வழங்கப்படும் என்று கேளுங்கள். மத்திய அரசின் பங்கு வேறுபடும்.
  source: null
conflicts:
- id: nsap_ages
  text:
    en: The national document gives ages 40 to 79 for the ₹300 central share, and a ₹500 central share from age 80.
    ta: 'தேசிய ஆவணம்: 40 முதல் 79 வயது வரை மத்தியப் பங்கு ₹300; 80 வயது முதல் ₹500.'
  source: nsap
- id: chennai_below_60
  text:
    en: A Chennai district page (2021) says applicants must be below 60.
    ta: 'சென்னை மாவட்டப் பக்கம் (2021): 60 வயதுக்குக் கீழ் இருக்க வேண்டும்.'
  source: chennai
- id: pudukkottai_conditions
  text:
    en: A Pudukkottai district page adds property below ₹50,000 and no son or similar adult relative living with her. It shows
      ₹1,000 a month.
    ta: 'புதுக்கோட்டை மாவட்டப் பக்கம்: சொத்து ₹50,000க்குள்; வயது வந்த மகன் போன்ற உறவினர் உடன் வசிக்கக் கூடாது. மாதம் ₹1,000
      என்று காட்டுகிறது.'
  source: pudukkottai
amounts:
- text:
    en: ₹1,200 a month in total
    ta: மொத்தம் மாதம் ₹1,200
  source: charter
  when: []
documents:
  confirmed: true
  note: null
  items:
  - id: ration_or_aadhaar
    text:
      en: Copy of ration card or Aadhaar card
      ta: ரேஷன் அட்டை அல்லது ஆதார் அட்டை நகல்
    how: null
  - id: age_proof
    text:
      en: Proof of age
      ta: வயதுச் சான்று
    how: null
  - id: husband_death_certificate
    text:
      en: Husband's death certificate
      ta: கணவரின் இறப்புச் சான்றிதழ்
    how: null
apply:
  text:
    en: Send the application to the Special Tahsildar (Social Security Scheme), the Special Deputy Collector (Social Security
      Scheme) or the District Collector.
    ta: விண்ணப்பத்தை தனி வட்டாட்சியர் (சமூகப் பாதுகாப்புத் திட்டம்), தனி துணை ஆட்சியர் (சமூகப் பாதுகாப்புத் திட்டம்) அல்லது
      மாவட்ட ஆட்சியருக்கு அனுப்புங்கள்.
  service_code: null
  charge_rupees: null
  source: charter
