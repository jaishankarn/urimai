id: manual-board-death
name:
  en: Manual Workers' Welfare Board death assistance
  ta: உடலுழைப்புத் தொழிலாளர் நலவாரிய இறப்பு உதவித்தொகை
aliases:
- உடலுழைப்பு நலவாரியம்
- அமைப்புசாரா தொழிலாளர் இறப்பு உதவி
- manual workers welfare board
- udaluzhaippu nalavariyam
conditions:
- id: husband_died
  text:
    en: Your husband has passed away
    ta: உங்கள் கணவர் காலமானார்
  kind: checkable
  any_of:
  - - fact: widowed
      op: eq
      value: 'yes'
      unknown_values: []
  source: labour
- id: lives_in_tn
  text:
    en: You live in Tamil Nadu
    ta: நீங்கள் தமிழ்நாட்டில் வசிக்கிறீர்கள்
  kind: checkable
  any_of:
  - - fact: lives_in_tn
      op: eq
      value: 'yes'
  source: labour
- id: manual_work
  text:
    en: He did other manual work covered by the board
    ta: அவர் வாரியத்தின் கீழ் வரும் பிற உடலுழைப்பு வேலை செய்தார்
  kind: checkable
  any_of:
  - - fact: husband_work
      op: eq
      value: other_manual
      unknown_values:
      - farm_labour
      - other
  source: labour
- id: registered
  text:
    en: He was registered with the board
    ta: அவர் நலவாரியத்தில் பதிவு செய்திருந்தார்
  kind: checkable
  any_of:
  - - fact: husband_board_registered
      op: eq
      value: 'yes'
  source: labour
checks:
- id: registration_valid
  text:
    en: Was his registration still valid when he died? We did not find the renewal rules.
    ta: அவர் இறந்தபோது நலவாரியப் பதிவு செல்லுபடியாக இருந்ததா? புதுப்பித்தல் விதிகள் எங்களுக்குக் கிடைக்கவில்லை.
  source: null
- id: deadline
  text:
    en: We could not confirm the claim deadline. Ask now, because there may be one.
    ta: கோரிக்கை அளிக்கக் கடைசி நாளை உறுதிப்படுத்த முடியவில்லை. கால வரம்பு இருக்கலாம், உடனே கேளுங்கள்.
  source: null
- id: documents
  text:
    en: Ask which documents the claim needs.
    ta: கோரிக்கைக்குத் தேவையான ஆவணங்களைக் கேளுங்கள்.
  source: null
- id: nominee
  text:
    en: Ask who the registered nominee is.
    ta: பதிவு செய்யப்பட்ட நியமனதாரர் யார் என்று கேளுங்கள்.
  source: null
conflicts: []
amounts:
- text:
    en: ₹30,000 for a natural death
    ta: இயற்கை மரணத்திற்கு ₹30,000
  source: labour_natural
  when:
  - fact: death_cause
    op: eq
    value: natural
- text:
    en: ₹1,25,000 for an accidental death
    ta: விபத்து மரணத்திற்கு ₹1,25,000
  source: labour
  when:
  - fact: death_cause
    op: eq
    value: accident
- text:
    en: ₹5,000 funeral assistance
    ta: ஈமச்சடங்கு உதவி ₹5,000
  source: labour_natural
  when: []
documents:
  confirmed: false
  note:
    en: Not confirmed. Ask the office.
    ta: உறுதிப்படுத்தப்படவில்லை. அலுவலகத்தில் கேளுங்கள்.
  items: []
apply:
  text:
    en: e-Sevai lists manual board claim services. Ask which one fits.
    ta: இ-சேவையில் உடலுழைப்பு நலவாரியக் கோரிக்கைச் சேவைகள் உள்ளன. எது பொருந்தும் என்று கேளுங்கள்.
  service_code: null
  charge_rupees: 60
  source: esevai
