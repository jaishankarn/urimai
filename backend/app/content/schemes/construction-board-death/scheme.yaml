# Reviewer: compare conditions, amounts and checks with each source's quote and link.
# When satisfied, set review to {by: your initials, on: date, checksum: output of
#   cd backend && .venv/bin/python -m scripts.review_checksum construction-board-death }
# Any later change to conditions, checks or amounts makes the rule unreviewed again.
id: construction-board-death
name:
  en: Construction Workers' Welfare Board death assistance
  ta: கட்டுமானத் தொழிலாளர் நலவாரிய இறப்பு உதவித்தொகை
aliases:
- கட்டுமான நலவாரியம்
- கட்டிடத் தொழிலாளர் இறப்பு உதவி
- construction welfare board
- kattumana nalavariyam
conditions:
- id: lives_in_tn
  text:
    en: You live in Tamil Nadu
    ta: நீங்கள் தமிழ்நாட்டில் வசிக்கிறீர்கள்
  kind: checkable
  any_of:
  - - fact: lives_in_tn
      op: eq
      value: 'yes'
  source: labour
- id: construction_work
  text:
    en: He did construction work
    ta: அவர் கட்டுமான வேலை செய்தார்
  kind: checkable
  any_of:
  - - fact: husband_work
      op: eq
      value: construction
  source: labour
- id: registered_or_worksite
  text:
    en: He was registered with the board, or he died in an accident at work (the worksite benefit includes unregistered workers)
    ta: அவர் நலவாரியத்தில் பதிவு செய்திருந்தார், அல்லது வேலை செய்யும்போது விபத்தில் இறந்தார் (பணியிட உதவி பதிவு செய்யாதவர்களுக்கும்
      உண்டு)
  kind: checkable
  any_of:
  - - fact: husband_board_registered
      op: eq
      value: 'yes'
  - - fact: death_cause
      op: eq
      value: accident
    - fact: death_at_work
      op: eq
      value: 'yes'
  source: labour
checks:
- id: registration_valid
  text:
    en: Was his registration still valid when he died? We did not find the renewal rules.
    ta: அவர் இறந்தபோது நலவாரியப் பதிவு செல்லுபடியாக இருந்ததா? புதுப்பித்தல் விதிகள் எங்களுக்குக் கிடைக்கவில்லை.
  source: null
- id: deadline
  text:
    en: We could not confirm the claim deadline. Ask now, because there may be one.
    ta: கோரிக்கை அளிக்கக் கடைசி நாளை உறுதிப்படுத்த முடியவில்லை. கால வரம்பு இருக்கலாம், உடனே கேளுங்கள்.
  source: null
- id: documents
  text:
    en: Ask which documents the claim needs.
    ta: கோரிக்கைக்குத் தேவையான ஆவணங்களைக் கேளுங்கள்.
  source: null
- id: nominee
  text:
    en: Ask who the registered nominee is.
    ta: பதிவு செய்யப்பட்ட நியமனதாரர் யார் என்று கேளுங்கள்.
  source: null
- id: worksite_amounts
  text:
    en: Ask how the worksite amount relates to the other amounts.
    ta: பணியிட விபத்து உதவித்தொகை மற்ற தொகைகளுடன் எப்படி இணையும் என்று கேளுங்கள்.
  source: null
conflicts: []
amounts:
- text:
    en: ₹50,000 for a natural death (registered workers)
    ta: இயற்கை மரணத்திற்கு ₹50,000 (பதிவு செய்தவர்கள்)
  source: labour_natural
  when:
  - fact: death_cause
    op: eq
    value: natural
  - fact: husband_board_registered
    op: eq
    value: 'yes'
- text:
    en: ₹2,00,000 for an accidental death (registered workers)
    ta: விபத்து மரணத்திற்கு ₹2,00,000 (பதிவு செய்தவர்கள்)
  source: labour
  when:
  - fact: death_cause
    op: eq
    value: accident
  - fact: husband_board_registered
    op: eq
    value: 'yes'
- text:
    en: ₹5,00,000 for an accidental death at a worksite, including unregistered workers
    ta: பணியிட விபத்து மரணத்திற்கு ₹5,00,000 (பதிவு செய்யாதவர்களும்)
  source: labour
  when:
  - fact: death_cause
    op: eq
    value: accident
  - fact: death_at_work
    op: eq
    value: 'yes'
- text:
    en: ₹5,000 funeral assistance (registered workers)
    ta: ஈமச்சடங்கு உதவி ₹5,000 (பதிவு செய்தவர்கள்)
  source: labour_natural
  when:
  - fact: husband_board_registered
    op: eq
    value: 'yes'
documents:
  confirmed: false
  note:
    en: Not confirmed. Ask the office.
    ta: உறுதிப்படுத்தப்படவில்லை. அலுவலகத்தில் கேளுங்கள்.
  items: []
apply:
  text:
    en: e-Sevai lists construction board claim services. Ask which one fits.
    ta: இ-சேவையில் கட்டுமான நலவாரியக் கோரிக்கைச் சேவைகள் உள்ளன. எது பொருந்தும் என்று கேளுங்கள்.
  service_code: null
  charge_rupees: 60
  source: esevai
