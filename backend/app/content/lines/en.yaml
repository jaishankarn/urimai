# Screen text and questions. English and Tamil must have the same keys, question ids and option values (tested).
ui:
  tagline: Your Voice. Your Rights. Your Benefits.
  intro: Answer a few questions to see which benefits may apply to you.
  memory_note: Your answers are not saved. They are lost if you reload this page.
  voice_not_ready: Voice is not working yet. Please tap your answers.
  start: Start
  back: Back
  next: Next
  dont_know: I don't know
  enter_number: Enter a number
  number_invalid: Please enter a number from {min} to {max}.
  question_of: Question {n} of {total}
  confirm_title: Check your answers
  confirm_help: Change anything that is wrong. Nothing is checked until you confirm.
  edit: Change
  see_results: These are correct. Show results
  checking: Checking…
  error_check: We could not check your answers. They are still here.
  try_again: Try again
  results_title: Your results
  no_guarantee: This does not guarantee eligibility or approval. Government officials decide.
  outcome_potentially_eligible: May be eligible
  outcome_needs_more_information: Needs more information
  outcome_appears_ineligible: Appears not eligible
  not_reviewed: Not yet reviewed by a person. We cannot show a match for this yet.
  amounts: What it could give
  amounts_note: Do not add amounts together. You may not get more than one.
  reasons: Why
  status_met: 'Yes'
  status_not_met: 'No'
  status_unknown: Not known
  status_needs_check: Needs checking
  checks: Still to be checked
  conflicts: Other government pages say different things
  sources: Sources
  source_date: Dated
  date_unknown: date not shown
  checked_on: Collected on
  apply: Where to apply
  your_district: Your district
  service_code: Service code
  charge: Listed service charge
  not_confirmed: Not confirmed. Ask the office.
  documents_button: See the documents
  documents_title: Documents
  document_of: Document {n} of {total}
  have: I have it
  dont_have: I don't have it
  how_to_get: How to get it
  still_need: You still need
  have_all: You said you have everything on this list.
  back_to_results: Back to results
  start_again: Start again
  talk_button: Talk to Urimai
  tap_button: Answer by tapping instead
  consent: Your voice and typed replies are sent to Sarvam, a speech and AI service, to turn them into text and details. Do
    not say Aadhaar, OTP or bank account numbers.
  talk_start: I agree. Start talking
  say_greeting: Hello. I am Urimai. How can I help you? Tell me about your situation.
  mic_start: Tap to speak
  mic_stop: Tap when you finish
  listening: Listening…
  thinking: Understanding…
  type_instead: Or type here
  send: Send
  replay: Hear it again
  you_said: You said
  understood: What I understood
  understood_none: I did not catch any details. Say it again, or answer the questions one by one.
  say_story_confirm: Please check what I understood. Is it right?
  story_yes: Yes, this is right
  story_again: Say it again
  story_skip: Answer the questions instead
  not_caught: Sorry, I did not understand. Please say it again, or tap an answer.
  last_answer: Noted
  mic_blocked: The microphone is not available. Type or tap instead.
  voice_down: Voice is not available right now. Type or tap instead.
  no_key_voice: Voice needs a Sarvam key, which is not set. You can tap your answers.
  say_confirm: I have what I need. Please check your answers.
  suggestions_title: Top suggestions
  see_all: See all results and sources
  say_intro: Here is what may apply to you. This is not a guarantee. Government officials decide.
  say_intro_none: I cannot yet say that any benefit may apply. These need more information.
  say_nothing: From your answers, none of the benefits I know about appears to apply. An office can tell you about others.
  group_widow_pensions: Widow pension
  group_widow_both_note: There is a state and a national widow pension. We have not confirmed whether you can receive both.
    Do not add the amounts.
  say_item: 'Suggestion {n}: {name}.'
  say_amount: 'It could give: {amount}.'
  say_why: 'It may apply because: {reasons}.'
  say_check: 'Still to be checked: {check}'
  say_deadline_tip: For benefits paid after a death, ask the office soon. We could not confirm the last date to claim.
  say_more: '{count} more may also apply. They are shown on the screen.'
  say_end: The screen shows what to check, the documents and the sources.
  say_checks_remain: 'Officials still need to check some things. They are on the screen.'
  hear_details: 'Hear why, and what to check'
