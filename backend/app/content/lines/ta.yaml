  still_need: இன்னும் தேவையானவை
  have_all: இப்பட்டியலில் உள்ள அனைத்தும் உங்களிடம் உள்ளதாகக் கூறினீர்கள்.
  back_to_results: முடிவுகளுக்குத் திரும்பு
  start_again: மீண்டும் தொடங்கு
  talk_button: உரிமையுடன் பேசுங்கள்
  tap_button: தொட்டுப் பதில் அளிக்கவும்
  consent: உங்கள் குரலும் தட்டச்சு செய்யும் பதில்களும் எழுத்தாகவும் விவரங்களாகவும் மாற்ற, Sarvam என்ற பேச்சு மற்றும் AI சேவைக்கு
    அனுப்பப்படும். ஆதார், OTP அல்லது வங்கிக் கணக்கு எண்ணைச் சொல்ல வேண்டாம்.
  talk_start: சம்மதம். பேசத் தொடங்கு
  say_greeting: வணக்கம். நான் உரிமை. நான் உங்களுக்கு எப்படி உதவலாம்? உங்கள் நிலைமையைச் சொல்லுங்கள்.
  mic_start: பேசத் தொடவும்
  mic_stop: பேசி முடித்ததும் தொடவும்
  listening: கேட்கிறேன்…
  thinking: புரிந்துகொள்கிறேன்…
  type_instead: அல்லது இங்கே தட்டச்சு செய்யுங்கள்
  send: அனுப்பு
  replay: மீண்டும் கேள்
  you_said: நீங்கள் சொன்னது
  understood: நான் புரிந்துகொண்டது
  understood_none: எந்த விவரமும் புரியவில்லை. மீண்டும் சொல்லுங்கள், அல்லது கேள்விகளுக்கு ஒவ்வொன்றாகப் பதில் அளியுங்கள்.
  say_story_confirm: நான் புரிந்துகொண்டதைப் பாருங்கள். சரியா?
  story_yes: ஆம், இது சரி
  story_again: மீண்டும் சொல்கிறேன்
  story_skip: கேள்விகளுக்கே பதில் அளிக்கிறேன்
  not_caught: மன்னிக்கவும், புரியவில்லை. மீண்டும் சொல்லுங்கள், அல்லது ஒரு பதிலைத் தொடுங்கள்.
  last_answer: பதிவு செய்தேன்
  mic_blocked: ஒலிவாங்கி கிடைக்கவில்லை. தட்டச்சு செய்யுங்கள் அல்லது தொடுங்கள்.
  voice_down: குரல் வசதி இப்போது கிடைக்கவில்லை. தட்டச்சு செய்யுங்கள் அல்லது தொடுங்கள்.
  no_key_voice: குரலுக்கு Sarvam விசை தேவை; அது அமைக்கப்படவில்லை. தொட்டுப் பதில் அளிக்கலாம்.
  say_confirm: எனக்குத் தேவையானவை கிடைத்துவிட்டன. உங்கள் பதில்களைச் சரிபாருங்கள்.
  suggestions_title: முக்கியப் பரிந்துரைகள்
  see_all: எல்லா முடிவுகளையும் ஆதாரங்களையும் பார்
  say_intro: உங்களுக்குப் பொருந்தக்கூடியவை இவை. இது உத்தரவாதம் அல்ல. அரசு அதிகாரிகளே முடிவு செய்வார்கள்.
  say_intro_none: எந்த உதவியும் பொருந்தலாம் என்று இப்போது சொல்ல முடியாது. இவற்றுக்கு மேலும் தகவல் தேவை.
  say_nothing: உங்கள் பதில்களின்படி, எனக்குத் தெரிந்த உதவிகள் எதுவும் பொருந்துவதாகத் தெரியவில்லை. பிற உதவிகள் பற்றி அலுவலகத்தில்
    கேளுங்கள்.
  group_widow_pensions: விதவை ஓய்வூதியம்
  group_widow_both_note: மாநில அரசு மற்றும் தேசிய விதவை ஓய்வூதியங்கள் உள்ளன. இரண்டையும் பெற முடியுமா என்பதை நாங்கள் உறுதிப்படுத்தவில்லை.
    தொகைகளைக் கூட்ட வேண்டாம்.
  say_item: 'பரிந்துரை {n}: {name}.'
  say_amount: 'கிடைக்கக்கூடியது: {amount}.'
  say_why: 'பொருந்தலாம் என்பதற்கான காரணம்: {reasons}.'
  say_check: 'இன்னும் சரிபார்க்க வேண்டியது: {check}'
  say_deadline_tip: இறப்புக்குப் பிறகு வழங்கப்படும் உதவிகளுக்கு அலுவலகத்தில் விரைவில் கேளுங்கள். விண்ணப்பிக்கக் கடைசி நாளை
    எங்களால் உறுதிப்படுத்த முடியவில்லை.
  say_more: மேலும் {count} உதவிகளும் பொருந்தலாம். அவை திரையில் காட்டப்பட்டுள்ளன.
  say_end: சரிபார்க்க வேண்டியவை, ஆவணங்கள் மற்றும் ஆதாரங்கள் திரையில் உள்ளன.
  say_checks_remain: 'சில விவரங்களை அதிகாரிகள் சரிபார்க்க வேண்டும். அவை திரையில் உள்ளன.'
  hear_details: 'காரணமும் சரிபார்க்க வேண்டியதும் கேள்'
